<h1 mat-dialog-title>Ajouter une formule repas</h1>
<div mat-dialog-content>
    Quel est le nom de cette formule ?
    <mat-form-field>
        <mat-label>Nom</mat-label>
        <input matInput 
            type = "text"
            class="form-control" 
            id = "nom"
            name = "nom"
            [(ngModel)] = "createRepas.nom" 
            #nom = "ngModel"
            required
            />
    </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button [mat-dialog-close]="createRepas" cdkFocusInitial>Ajouter</button>
</div>
