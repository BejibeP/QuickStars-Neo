<h1 mat-dialog-title>Voulez-vous vraiment supprimer ce joueur ?</h1>
<div mat-dialog-content>Cette opération est irréversible et ce joueur sera supprimé des matchs où il est inscrit.</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button mat-dialog-close="true" cdkFocusInitial>Oui</button>
</div>
