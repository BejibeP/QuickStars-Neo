<h1 mat-dialog-title>Voulez-vous vraiment supprimer ce match ?</h1>
<div mat-dialog-content>Cette opération est irréversible et la liste des joueurs inscrits ne pourra pas être récupérée.</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button mat-dialog-close="true" cdkFocusInitial>Oui</button>
</div>
