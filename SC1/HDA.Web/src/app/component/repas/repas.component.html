<div class="espace">
    <mat-accordion>
        <mat-expansion-panel [expanded]="openState === true" (opened)="openState = true" (closed)="openState = false">
        <mat-expansion-panel-header>
            <mat-panel-title> Ajouter une formule repas </mat-panel-title>
            <mat-panel-description *ngIf="!openState"> Cliquez pour ajouter une formule repas </mat-panel-description>
        </mat-expansion-panel-header>
        <form (ngSubmit)="create(form)" #form="ngForm">
            <mat-form-field [style.width.%]="75" appearance="outline">
                <mat-label>Intitulé de la formule</mat-label>
                <input matInput 
                    type = "text"
                    class="form-control" 
                    id = "nom"
                    name = "nom"
                    [(ngModel)] = "createRepas.nom" 
                    #nom = "ngModel"
                    required
                    />
                <mat-hint>Pensez à préciser les ingrédients</mat-hint>
            </mat-form-field>
            <div class="buttonCenter">
                <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Ajouter</button>
            </div>
            
        </form>
        </mat-expansion-panel>
    </mat-accordion>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
    <form #form="ngForm">
    <ng-container matColumnDef="formule">
        <th mat-header-cell *matHeaderCellDef  
            [style.width.%]="75">Formule repas</th>
        <td mat-cell *matCellDef="let repas">
            <mat-form-field [style.width.%]="100" appearance="outline">
                <input matInput       
                    type = "text"
                    name = {{repas.nom}}
                    class="form-control" 
                    [(ngModel)] = "repas.nom" 
                    #libelle = "ngModel"
                    required
                    [disabled]="!repas.wantModify"
                />
            </mat-form-field>
        </td>
    </ng-container>

    <ng-container matColumnDef="dispo">
        <th mat-header-cell *matHeaderCellDef 
             [style.width.%]="5">Disponible</th>
        <td mat-cell *matCellDef="let repasVue">
            <mat-checkbox
                style="margin: 20px"
                [(ngModel)]="repasVue.estDisponible"
                value="true"
                name={{repasVue.id}}
                checked={{repasVue.estDisponible}}
                #dispo = "ngModel"
                [disabled]="!repasVue.wantModify"
                ></mat-checkbox>
        </td>
    </ng-container>

    <ng-container matColumnDef="buttonModif">
        <th mat-header-cell *matHeaderCellDef  
                [style.width.%]="5"
                ></th>
        <td mat-cell *matCellDef="let repasVue">
            <button mat-icon-button 
            class="btn btn-outline-primary" 
            style="margin-right: 20px"
            (click)="askModify(repasVue!)"
            *ngIf="!repasVue.wantModify"
            ><mat-icon>mode</mat-icon></button>

            <button mat-icon-button *ngIf="repasVue.wantModify"
                class="btn btn-outline-primary" 
                style="margin-right: 20px"
                (click)="modify(repasVue, repasVue.id!)"
            ><mat-icon>save</mat-icon></button>
        </td>
    </ng-container>

    <ng-container matColumnDef="buttonDel">
        <th mat-header-cell *matHeaderCellDef  
                [style.width.%]="5"
                ></th>
        <td mat-cell *matCellDef="let repasVue">
            <button mat-icon-button 
                class="btn btn-outline-primary" 
                style="margin-right: 20px"
                (click)="askDeleteRepas(repasVue.id!)"
                color="warn"
                ><mat-icon>delete</mat-icon></button>
        </td>
    </ng-container>

    <tr mat-header-row class="headerRow" *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="row" *matRowDef="let row; columns: displayedColumns;"></tr>
</form>
</table>
<mat-paginator
    [pageSize]="50"
    aria-label="Select page"
    showFirstLastButtons>
</mat-paginator>
